<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Login & Register with Borders</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .container {
            position: relative;
            width: 820px;
            height: 520px;
            background: #fff;
            /* Container par sundar border aur shadow add ki gayi hai */
            border: 3px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3), 
                        0 0 20px rgba(102, 126, 234, 0.4);
            border-radius: 20px;
            overflow: hidden;
        }

        .form-box {
            position: absolute;
            top: 0;
            left: 0;
            width: 50%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 40px;
            transition: 0.6s ease-in-out;
            background: #ffffff;
        }

        .login-box {
            left: 0;
            z-index: 2;
        }

        .register-box {
            left: 50%;
            z-index: 1;
            opacity: 0;
        }

        /* Animation Classes */
        .container.active .login-box {
            transform: translateX(100%);
            opacity: 0;
        }

        .container.active .register-box {
            transform: translateX(-100%);
            opacity: 1;
            z-index: 2;
        }

        h2 {
            margin-bottom: 20px;
            color: #333;
            font-size: 26px;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            margin: 8px 0;
            /* Input fields par clean border */
            border: 2px solid #e1e1e1;
            background: #f9f9f9;
            border-radius: 8px;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #667eea;
            background: #fff;
            box-shadow: 0 0 8px rgba(102, 126, 234, 0.3);
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .toggle-btn {
            background: transparent;
            color: #667eea;
            /* Toggle button par border add ki gayi hai */
            border: 2px solid #667eea;
            margin-top: 10px;
        }

        .toggle-btn:hover {
            background: #667eea;
            color: white;
        }
    </style>
</head>
<body>

    <div class="container" id="container">
        <!-- Login Form -->
        <div class="form-box login-box">
            <h2>Welcome Back</h2>
            <form onsubmit="handleLogin(event)">
                <input type="email" placeholder="Email" required>
                <input type="password" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>
            <button class="toggle-btn" onclick="toggleForm()">Create Account (Register)</button>
        </div>

        <!-- Register Form -->
        <div class="form-box register-box">
            <h2>Create Account</h2>
            <form onsubmit="handleRegister(event)">
                <input type="text" placeholder="Name" required>
                <input type="email" placeholder="Email" required>
                <input type="tel" placeholder="Contact No" required>
                <input type="password" placeholder="Password" required>
                <input type="text" placeholder="City" required>
                <button type="submit">Register</button>
            </form>
            <button class="toggle-btn" onclick="toggleForm()">Already have an account? Login</button>
        </div>
    </div>

    <script>
        const container = document.getElementById('container');

        function toggleForm() {
            container.classList.toggle('active');
        }

        function handleRegister(event) {
            event.preventDefault();
            alert("Successful! Registration ho gayi hai.");
        }

        function handleLogin(event) {
            event.preventDefault();
            alert("Successful! Login ho gaya hai.");
        }
    </script>

</body>
</html>
