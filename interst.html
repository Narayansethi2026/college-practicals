<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INTSERST CALCUKATOR</title>
</head>

<body>
    <div class="container">
        <h1>simple interst calcukator</h1>
        <p class="subtitle"> p * r * t * / 100</p>

        <form id="siform" novalidate>
            <div class="input-group">
                <label>principal amount</label>
                <input type="number" id="principal" placeholder="e.g 100000000">
                <small class="error" id="principalerr"></small>

            </div>

            <div class="input-group">
                <label>rate of interst(% per year)</label>
                <input type="number" id="rate" placeholder="e.g 8.5">
                <small class="error" id="rateerr"></small>
            </div>

            <div class="input-group">
                <label>Time (Years)</label>
                <input type="number" id="time" placeholder="e.g. 3" step="0.01" />
                <small class="error" id="timeErr"></small>
            </div>

            <div class="btn-group">
                <button type="submit" class="btn-calc">calculator</button>
                <button type="button" id="resetbtn" class="btn-reset">reset</button>
            </div>
        </form>

        div class="result-box hidden" id="resultBox">
        <h2>📊 Result</h2>
        <div class="result-row">
            <span>Simple Interest:</span>
            <strong id="siResult">₹0</strong>
        </div>
        <div class="result-row">
            <span>Total Amount:</span>
            <strong id="totalResult">₹0</strong>
        </div>
    </div>


    </div>
</body>

</html>
